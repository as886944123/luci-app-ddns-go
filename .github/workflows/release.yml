name: Build ddns-go (aarch64_generic)

# 仅手动触发，不自动跑
on:
  workflow_dispatch:

# 赋予必要权限
permissions:
  contents: read

env:
  PACKAGE_DIRS: "ddns-go luci-app-ddns-go"

jobs:
  build:
    name: 编译 aarch64_generic IPK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 编译 OpenWrt 包 (仅你要的架构/版本)
      - name: 编译 ddns-go
        uses: sirpdboy/gh-action-sdk@go1.26
        env:
          ARCH: aarch64_generic-openwrt-24.10
          FEEDNAME: packages_ci
          PACKAGES: luci-app-ddns-go
          NO_REFRESH_CHECK: true

      # 上传编译好的IPK包 (GitHub官方功能，无权限报错)
      - name: 下载编译好的IPK
        uses: actions/upload-artifact@v4
        with:
          name: ddns-go-aarch64_generic
          path: bin/packages/aarch64_generic/packages_ci/*.ipk
